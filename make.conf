# Compiler optimizations
COMMON_FLAGS="-march=tigerlake -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Build jobs - 8 threads for Intel 11th Gen i5/i7
MAKEOPTS="-j8 -l8"

# Emerge defaults:
# --autounmask=y --autounmask-write=y --autounmask-continue=y: automatically handle USE & keyword requirements
# --autounmask-backtrack=y: ensure unmasking works during backtracking
# --backtrack=100: deep dependency resolution
# --binpkg-respect-use=y: use binary packages only if USE flags match
# --getbinpkg=y: fetch official precompiled binary packages when available
EMERGE_DEFAULT_OPTS="--jobs=8 --load-average=8.0 --autounmask=y --autounmask-write=y --autounmask-continue=y --autounmask-backtrack=y --backtrack=100 --binpkg-respect-use=y --getbinpkg=y"

# Support binary packages and safe builds
FEATURES="binpkg-request-signature parallel-fetch parallel-install clean-logs"

GRUB_PLATFORMS="efi-64"
ACCEPT_LICENSE="*"

# Global USE Flags:
# opengl, egl, X, wayland, gui, widgets ensure Wayland/X/GUI/Qt/GTK apps build cleanly without REQUIRED_USE conflicts
USE="opengl egl X wayland gui widgets dbus udev alsa vulkan bluetooth pipewire pulseaudio networkmanager wifi btrfs -systemd -consolekit -cups -telemetry -debug"

VIDEO_CARDS="intel iris"
INPUT_DEVICES="libinput"

GENTOO_MIRRORS="https://distfiles.gentoo.org/ https://gentoo.osuosl.org/ http://mirror.leaseweb.com/gentoo/"
